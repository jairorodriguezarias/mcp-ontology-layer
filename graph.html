2002/07/owl#Class"}, {"arrows": "to", "from": "http://banco.es/ontologies/core#Hipoteca_Fija_001", "label": "type", "title": "type", "to": "http://banco.es/ontologies/core#PrestamoHipotecario"}, {"arrows": "to", "from": "http://banco.es/ontologies/core#Loan", "label": "subClassOf", "title": "subClassOf", "to": "http://banco.es/ontologies/core#FinancialProduct"}]);

                  nodeColors = {};

};
